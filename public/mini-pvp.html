<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Militia · PvP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    body { background: #0b1a2f; display: flex; justify-content: center; align-items: center; height: 100dvh; width: 100dvw; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: fixed; }
    #game-wrapper { position: absolute; width: 100dvh; height: 100dvw; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(90deg); background: #2a3f5a; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 50px rgba(0,0,0,0.8); }
    @media (orientation: landscape) { #game-wrapper { width: 100dvw; height: 100dvh; transform: translate(-50%, -50%) rotate(0deg); } }
    canvas { display: block; width: 100%; height: 100%; background: #2b4a66; touch-action: none; z-index: 1; }
    .top-hud { position: absolute; top: 10px; left: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 10; pointer-events: none; }
    .hud-row { display: flex; justify-content: space-between; align-items: center; }
    .health-armor-container { display: flex; flex-direction: column; gap: 4px; }
    .bar-bg { width: 140px; height: 14px; background: #2e2e2e; border-radius: 30px; overflow: hidden; border: 2px solid #5a7a9a; box-shadow: inset 0 0 10px #000000aa; }
    .health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71); transition: width 0.1s ease; }
    .armor-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3498db, #9b59b6); transition: width 0.1s ease; }
    .score-container { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
    .score { background: #1d2f40; padding: 4px 16px; border-radius: 40px; border: 2px solid #7fa9c7; color: #fff; font-weight: bold; }
    .timer-box { background: rgba(0,0,0,0.6); border: 2px solid #f1c40f; color: #f1c40f; padding: 4px 15px; border-radius: 10px; font-weight: 900; font-size: 18px; display: block; }
    .weapon-inventory { display: flex; gap: 10px; pointer-events: auto; margin-top: 5px; }
    .weapon-slot { width: 70px; height: 60px; background: rgba(30, 50, 70, 0.8); border: 2px solid #5a7a9a; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #8899aa; font-size: 9px; font-weight: bold; transition: all 0.2s; position: relative; overflow: hidden; touch-action: manipulation; }
    .weapon-slot.active { border-color: #f1c40f; background: rgba(241, 196, 15, 0.2); color: #fff; transform: scale(1.05); box-shadow: 0 0 10px #f1c40f; }
    .weapon-slot svg { width: 90%; height: 70%; margin-bottom: 2px; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5)); }
    .zoom-ui { position: absolute; right: 20px; top: 100px; display: flex; flex-direction: column; gap: 5px; z-index: 10; display: none; pointer-events: auto; }
    .zoom-btn { width: 45px; height: 45px; border-radius: 50%; background: rgba(0,0,0,0.7); border: 2px solid #f1c40f; color: #f1c40f; font-weight: bold; display: flex; justify-content: center; align-items: center; font-size: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); touch-action: manipulation; }
    .zoom-btn.active { background: #f1c40f; color: #000; }
    .action-buttons { position: absolute; right: 160px; bottom: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 20; pointer-events: auto; }
    .action-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 12px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5); flex-direction: column; touch-action: manipulation; }
    .reload-btn { background: radial-gradient(circle at 35% 35%, #f1c40f, #b8860b); border: 3px solid #fff; color: #000; }
    .reload-btn:active { transform: scale(0.9); }
    .bomb-btn { background: radial-gradient(circle at 35% 35%, #e74c3c, #800000); border: 3px solid #fff; color: #fff; font-size: 24px; }
    .bomb-btn:active { transform: scale(0.9); }
    .mobile-controls { position: absolute; bottom: 0; left: 0; right: 0; height: 150px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 40px 30px 40px; pointer-events: none; z-index: 20; }
    .joystick-base { width: 110px; height: 110px; border-radius: 50%; background: rgba(30, 50, 70, 0.3); border: 3px solid rgba(160, 210, 255, 0.7); box-shadow: 0 0 20px rgba(0, 160, 255, 0.3), inset 0 0 25px rgba(0, 0, 0, 0.5); position: relative; pointer-events: auto; touch-action: none; backdrop-filter: blur(2px); }
    .joystick-knob { width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #d4eaff, #3a6a9a); border: 2px solid white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 6px 12px black, 0 0 15px #4aa3ff; pointer-events: none; will-change: transform; }
    .shoot-base { width: 110px; height: 110px; border-radius: 50%; background: rgba(90, 30, 30, 0.3); border: 3px solid rgba(255, 120, 120, 0.7); box-shadow: 0 0 20px rgba(255, 60, 60, 0.3), inset 0 0 25px rgba(0, 0, 0, 0.5); position: relative; pointer-events: auto; touch-action: none; backdrop-filter: blur(2px); }
    .shoot-knob { width: 45px; height: 45px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd4d4, #b83a3a); border: 2px solid white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 6px 12px black, 0 0 15px #ff6a6a; pointer-events: none; will-change: transform; }
    .shoot-base .fire-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2rem; opacity: 0.4; pointer-events: none; }
    .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; backdrop-filter: blur(5px); }
    .hidden { display: none !important; }
    .overlay-screen h1 { font-size: 40px; margin-bottom: 10px; color: #e74c3c; }
    .overlay-screen p { font-size: 18px; color: #bdc3c7; margin-bottom: 20px; }
    .btn-back { padding: 15px 30px; background: #3498db; color: white; text-decoration: none; border-radius: 10px; font-weight: bold; font-size: 18px; margin-top: 20px;}
    .scoreboard { position: absolute; top: 90px; left: 15px; background: rgba(0,0,0,0.6); border-radius: 10px; padding: 8px 12px; z-index: 10; pointer-events: none; font-size: 13px; color: #fff; min-width: 180px; border: 1px solid rgba(255,255,255,0.1); }
    .scoreboard-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
    .scoreboard-me { color: #f1c40f; font-weight: 900; }
    .scoreboard-team1 { color: #60a5fa; }
    .scoreboard-team2 { color: #f87171; }
  </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div class="top-hud">
        <div class="hud-row">
            <div class="health-armor-container">
                <div class="bar-bg"><div id="healthFill" class="health-fill"></div></div>
                <div class="bar-bg" style="height: 10px; width: 110px;"><div id="armorFill" class="armor-fill"></div></div>
            </div>
            <div class="score-container">
                <div id="timerDisplay" class="timer-box">00:00</div>
                <div id="scoreDisplay" class="score">💀 0</div>
            </div>
        </div>
        <div id="weaponInventory" class="weapon-inventory"></div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div id="zoomUi" class="zoom-ui">
        <div class="zoom-btn" onclick="setZoom(1, this)">1x</div>
        <div class="zoom-btn" onclick="setZoom(2, this)">2x</div>
        <div class="zoom-btn" onclick="setZoom(3, this)">3x</div>
        <div class="zoom-btn" onclick="setZoom(5, this)">5x</div>
    </div>
    <div class="action-buttons">
        <div id="bombBtn" class="action-btn bomb-btn" onclick="triggerBomb()">💣</div>
        <div id="reloadBtn" class="action-btn reload-btn" onclick="triggerReload()">RELOAD</div>
    </div>
    <div class="mobile-controls">
        <div id="joystickBase" class="joystick-base"><div id="joystickKnob" class="joystick-knob"></div></div>
        <div id="shootBase" class="shoot-base">
            <div class="fire-icon">🔥</div>
            <div id="shootKnob" class="shoot-knob"></div>
        </div>
    </div>
</div>

<div id="respawnScreen" class="overlay-screen hidden" style="background: rgba(0,0,0,0.9);">
    <h1 style="color:#f1c40f;font-size:48px;">YOU DIED</h1>
    <p id="respawnKiller" style="font-size:20px;color:#fff;margin:20px 0;">Killed by: —</p>
    <p style="font-size:14px;color:#94a3b8;margin:5px 0;">Killer's kills:</p>
    <p id="respawnKillerKills" style="font-size:56px;color:#22c55e;font-weight:900;margin:5px 0;">0</p>
    <p style="font-size:24px;color:#fff;margin-top:20px;">Respawn in <span id="respawnTimer" style="color:#f1c40f;font-weight:900;">3</span>...</p>
</div>

<div id="gameOverScreen" class="overlay-screen hidden">
    <h1 id="gameOverTitle">GAME OVER</h1>
    <p id="gameOverText">Time up!</p>
    <div id="gameOverLeaderboard" style="margin:20px 0;"></div>
    <p id="gameOverPayout" style="font-size: 24px; font-weight: bold; color: #f1c40f; margin-top: 15px;"></p>
    <a href="mini-lobby.html" class="btn-back">Back to Lobby</a>
</div>

<script src="/js/maps.js"></script>
<script src="/js/mini-common.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
    const API_BASE = window.location.origin;
    const urlParams = new URLSearchParams(window.location.search);
    const roomCode = urlParams.get('code');
    const userId = localStorage.getItem("userId");
    const username = localStorage.getItem("nickname") || "Player";

    let currentRoomData = null;
    let gameEnded = false;
    let serverEndsAt = null;
    let serverKills = 0;

    let socket = null;
    let mySocketId = null;
    let remotePlayers = new Map();
    let lastPositionSend = 0;
    let respawnCountdown = 0;
    let respawnKillerName = "";
    let respawnKillerKills = 0;
    let isAlive = true;

    if (!roomCode || !userId) {
        alert("Invalid Room or Not Logged In");
        window.location.href = "mini-lobby.html";
    }

    window.walls = [];
    window.bushes = [];
    window._mapApplyHook = null;
    window.loadMapLayout = function(id) {
        const map = (window.MINI_MAPS && window.MINI_MAPS[id]) || (window.MINI_MAPS && window.MINI_MAPS[1]);
        if (!map) { console.warn('MINI_MAPS not loaded'); return; }
        window.walls = JSON.parse(JSON.stringify(map.walls));
        window.bushes = JSON.parse(JSON.stringify(map.bushes));
        window.currentTheme = map;
        console.log(`Map loaded: ${map.name} (${window.walls.length} walls, ${window.bushes.length} bushes)`);
        if (window._mapApplyHook) window._mapApplyHook();
    };

    function updateScoreboard(players) {
        const el = document.getElementById("scoreboard");
        if (!el) return;
        const sorted = [...players].sort((a, b) => (b.kills || 0) - (a.kills || 0));
        el.innerHTML = sorted.map(p => {
            const me = p.username === username;
            const cls = me ? 'scoreboard-me' : (p.team === 1 ? 'scoreboard-team1' : 'scoreboard-team2');
            return `<div class="scoreboard-row ${cls}">
                <span>${p.username}${me ? ' (you)' : ''}</span>
                <span>${p.kills || 0}</span>
            </div>`;
        }).join('');
    }

    async function loadRoom() {
        try {
            const res = await fetch(`${API_BASE}/mini/room/${roomCode}`);
            if (!res.ok) { console.log("Room load failed"); return; }
            currentRoomData = (await res.json()).room;
            window.loadMapLayout(currentRoomData.mapId || 1);

            const me = (currentRoomData.players || []).find(p => String(p.username) === String(username) && !p.isBot);
            if (me) serverKills = me.kills || 0;

            updateScoreboard(currentRoomData.players.filter(p => !p.isBot));

            if (currentRoomData.startedAt && currentRoomData.endsAt) {
                serverEndsAt = new Date(currentRoomData.endsAt).getTime();
            } else {
                serverEndsAt = Date.now() + (currentRoomData.timeLimit || 3) * 60 * 1000;
            }
            const timerDisplay = document.getElementById('timerDisplay');
            const tick = () => {
                if (gameEnded) return;
                const remain = Math.max(0, serverEndsAt - Date.now());
                const m = Math.floor(remain / 60000).toString().padStart(2, '0');
                const s = Math.floor((remain % 60000) / 1000).toString().padStart(2, '0');
                timerDisplay.textContent = `${m}:${s}`;
                if (remain <= 0) { endTheMatch("TIME UP!"); return; }
                requestAnimationFrame(tick);
            };
            tick();
        } catch (e) { console.log("Failed to load room data", e); }

        connectMultiplayer();
    }
    loadRoom();

    function connectMultiplayer() {
        if (!roomCode || !username || !currentRoomData) return;
        socket = io(window.location.origin, { transports: ["websocket", "polling"] });

        socket.on("connect", () => {
            mySocketId = socket.id;
            console.log("✅ Socket connected:", mySocketId);
            const me = currentRoomData.players.find(p => p.username === username);
            socket.emit("join-room", {
                roomCode, userId, username,
                team: me ? me.team : 1
            }, (ack) => {
                if (ack && ack.ok) console.log("✅ Joined room via socket");
                else console.error("❌ Socket join failed:", ack && ack.error);
            });
        });

        socket.on("room-state", (state) => {
            state.players.forEach(p => {
                if (p.socketId === mySocketId) {
                    // ✅ THIS IS ME — sync my position with the server's spawn point
                    if (window.gameInstance && window.gameInstance.player) {
                        window.gameInstance.player.x = p.x;
                        window.gameInstance.player.y = p.y;
                        window.gameInstance.camera.x = p.x;
                        window.gameInstance.camera.y = p.y;
                        console.log("🎯 My spawn synced:", p.x, p.y);
                    }
                } else {
                    remotePlayers.set(p.socketId, p);
                }
            });
            updateScoreboard([...remotePlayers.values()].concat([{ username, kills: serverKills, team: 1 }]));
        });

        socket.on("player-joined", (data) => {
            remotePlayers.set(data.socketId, {
                socketId: data.socketId,
                username: data.username,
                team: data.team,
                x: data.x || 300, y: data.y || 300, angle: 0,
                health: data.health || 100,
                kills: data.kills || 0,
                alive: data.alive !== false
            });
            updateScoreboard([...remotePlayers.values()].concat([{ username, kills: serverKills, team: 1 }]));
        });

        socket.on("player-moved", (data) => {
            const p = remotePlayers.get(data.socketId);
            if (p) {
                p.x = data.x; p.y = data.y; p.angle = data.angle;
                p.health = data.health; p.alive = data.alive;
            }
        });

        socket.on("player-left", (data) => {
            remotePlayers.delete(data.socketId);
        });

        socket.on("player-died", (data) => {
            const victim = remotePlayers.get(data.victimSocketId);
            if (victim) { victim.alive = false; victim.health = 0; }
            const killer = remotePlayers.get(data.killerSocketId);
            if (killer) killer.kills = data.killerKills;
            if (data.killerUsername === username) {
                serverKills = data.killerKills;
                document.getElementById("scoreDisplay").innerText = `💀 ${serverKills}`;
            }
            updateScoreboard([...remotePlayers.values()].concat([{ username, kills: serverKills, team: 1 }]));
        });

        socket.on("took-damage", (data) => {
            if (!isAlive) return;
            window.gameInstance.player.health = data.newHealth;
            document.getElementById("healthFill").style.width = (data.newHealth / 100 * 100) + '%';
            window.gameInstance.shakeTime = 10;
            window.gameInstance.sound.play("hurt", 0.4);
        });

        socket.on("player-hit", (data) => {
            respawnCountdown = Math.ceil(data.respawnInMs / 1000);
            respawnKillerName = data.killerUsername;
            respawnKillerKills = data.killerKills;
            isAlive = false;
            window.gameInstance.isAlive = false;
            showRespawnOverlay();
        });

        socket.on("player-respawned", (data) => {
            console.log("🔄 player-respawned:", data);
            if (data.socketId === mySocketId) {
                // Reset player
                window.gameInstance.player.x = data.x;
                window.gameInstance.player.y = data.y;
                window.gameInstance.player.health = 100;
                window.gameInstance.player.armor = 0;
                window.gameInstance.player.invincible = false;
                window.gameInstance.player.invincibleTimer = 0;
                window.gameInstance.camera.x = data.x;
                window.gameInstance.camera.y = data.y;

                isAlive = true;
                window.gameInstance.isAlive = true;
                respawnCountdown = 0;

                document.getElementById("healthFill").style.width = "100%";
                document.getElementById("armorFill").style.width = "0%";

                // Reset joysticks
                window.gameInstance.moveAnalogActive = false;
                window.gameInstance.moveVector = { x: 0, y: 0 };
                window.gameInstance.shootAnalogActive = false;
                window.gameInstance.shootVector = { x: 0, y: 0 };

                const jKnob = document.getElementById("joystickKnob");
                const sKnob = document.getElementById("shootKnob");
                if (jKnob) jKnob.style.transform = "translate(-50%, -50%)";
                if (sKnob) sKnob.style.transform = "translate(-50%, -50%)";

                hideRespawnOverlay();
                console.log("✅ Respawn complete:", data.x, data.y);
            } else {
                const p = remotePlayers.get(data.socketId);
                if (p) {
                    p.x = data.x; p.y = data.y;
                    p.health = 100; p.alive = true;
                    p.kills = data.kills;
                }
            }
        });

        socket.on("bullet-from-remote", (data) => {
            window.gameInstance.bullets.push({
                x: data.bullet.x, y: data.bullet.y,
                vx: data.bullet.vx, vy: data.bullet.vy,
                radius: 5, friendly: false,
                life: 100, dmg: data.bullet.dmg || 10,
                color: '#ff9900',
                fromSocketId: data.socketId,
                bulletId: data.bulletId
            });
            // Play remote sound
            const remoteWeapon = data.bullet.weapon || "pistol";
            try {
                const soundObj = new Audio(`/sounds/shoot_${remoteWeapon}.mp3`);
                soundObj.volume = 0.4;
                soundObj.play().catch(() => {});
            } catch(e) {}
        });

        socket.on("game-ended", () => {
            if (!gameEnded) endTheMatch("TIME UP!");
        });
    }

    function showRespawnOverlay() {
        const el = document.getElementById("respawnScreen");
        if (!el) return;
        el.classList.remove("hidden");
        document.getElementById("respawnKiller").textContent = "Killed by: " + respawnKillerName;
        document.getElementById("respawnKillerKills").textContent = respawnKillerKills;

        const tickRespawn = setInterval(() => {
            respawnCountdown--;
            const timerEl = document.getElementById("respawnTimer");
            if (timerEl) timerEl.textContent = Math.max(0, respawnCountdown);
            if (respawnCountdown <= 0) {
                clearInterval(tickRespawn);
                if (socket && socket.connected) socket.emit("respawn");
                hideRespawnOverlay();
            }
        }, 1000);
    }

    function hideRespawnOverlay() {
        const el = document.getElementById("respawnScreen");
        if (el) el.classList.add("hidden");
    }

    async function endTheMatch(reason) {
        if (gameEnded) return;
        gameEnded = true;
        document.getElementById("gameOverScreen").classList.remove("hidden");
        document.getElementById("gameOverText").innerText = reason;

        try {
            const res = await fetch(`${API_BASE}/mini/end/${roomCode}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({})
            });
            const data = await res.json();
            const payoutEl = document.getElementById("gameOverPayout");
            const boardEl = document.getElementById("gameOverLeaderboard");

            if (data.leaderboard) {
                boardEl.innerHTML = data.leaderboard.map((p, i) =>
                    `<div style="padding:4px 0;color:${i === 0 ? '#f1c40f' : '#fff'}">${i + 1}. ${p.username} — ${p.kills} kills</div>`
                ).join('');
            }

            const myPayout = (data.payouts || []).find(x => String(x.userId) === String(userId));
            if (myPayout) {
                payoutEl.innerText = `You won ₦${Number(myPayout.amount).toFixed(2)}! (${myPayout.position})`;
                payoutEl.style.color = "#22c55e";
            } else {
                payoutEl.innerText = `You didn't place in the money.`;
                payoutEl.style.color = "#ef4444";
            }
        } catch(e) {
            document.getElementById("gameOverPayout").innerText = "Error settling.";
        }
    }

    window.setZoom = function(level, el) {
        if (window.gameInstance) window.gameInstance.zoomLevel = level;
        document.querySelectorAll('.zoom-btn').forEach(btn => btn.classList.remove('active'));
        if (el) el.classList.add('active');
    };
    window.triggerReload = function() { if (window.gameInstance) window.gameInstance.reloadWeapon(); };
    window.triggerBomb = function() { if (window.gameInstance) window.gameInstance.dropBomb(); };

    // ============================================================
    // GAME ENGINE
    // ============================================================
    (function() {
        const C = window.MiniCommon;
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const healthFill = document.getElementById('healthFill');
        const armorFill = document.getElementById('armorFill');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const weaponInventory = document.getElementById('weaponInventory');
        const zoomUi = document.getElementById('zoomUi');
        const wrapper = document.getElementById('game-wrapper');
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        const shootBase = document.getElementById('shootBase');
        const shootKnob = document.getElementById('shootKnob');
        const MAP_W = 2400, MAP_H = 1800;
        let camera = { x: MAP_W/2, y: MAP_H/2, zoom: 1 };
        let shakeTime = 0;

        const sound = new C.SoundManager();
        sound.unlockOnFirstTouch();
        sound.preloadAll && sound.preloadAll();

        const weapons = C.WEAPONS;
        let walls = window.walls || [];
        let bushes = window.bushes || [];

        window._mapApplyHook = function() {
            walls = window.walls;
            bushes = window.bushes;
            crates = [];
            for (let i = 0; i < 10; i++) spawnCrate();
        };

        const player = {
            x: MAP_W/2, y: MAP_H/2, radius: 18, vx: 0, vy: 0, speed: 3.8,
            health: 100, maxHealth: 100, armor: 0, maxArmor: 100,
            invincible: false, invincibleTimer: 0,
            aimAngle: 0, color: '#3a9bdc',
            inventory: ['pistol', null, null], currentSlot: 0,
            shootTimer: 0, ammo: 10, maxAmmo: 10, isReloading: false, reloadTimer: 0, inBush: false
        };

        let crates = [], bullets = [], bombs = [];
        const keys = { w: false, a: false, s: false, d: false };
        let mouseX = 0, mouseY = 0, moveAnalogActive = false, moveVector = { x: 0, y: 0 };
        let shootAnalogActive = false, shootVector = { x: 0, y: 0 };

        window.gameInstance = {
            zoomLevel: 1, player, camera,
            bullets: bullets,
            isAlive: true,
            shakeTime: 0,
            sound: sound,
            moveAnalogActive: false,
            moveVector: { x: 0, y: 0 },
            shootAnalogActive: false,
            shootVector: { x: 0, y: 0 },
            reloadWeapon: () => { if (!player.isReloading) { const w = getCurrentWeapon(); if (player.ammo < w.maxAmmo) { player.isReloading = true; player.reloadTimer = 90; } } },
            dropBomb: () => { if (isAlive) bombs.push({ x: player.x, y: player.y, timer: 90, radius: 250 }); }
        };

        const svgs = {
            pistol: `<svg viewBox="0 0 220 140"><rect x="30" y="48" width="130" height="22" rx="5" fill="#2e3440" stroke="#ebcb8b" stroke-width="1.8"/></svg>`,
        };

        function resize() { canvas.width = wrapper.clientWidth; canvas.height = wrapper.clientHeight; updateCameraZoom(); }
        window.addEventListener('resize', resize);

        function updateCameraZoom() {
            camera.zoom = C.computeCameraZoom(canvas.width, canvas.height, player.inventory[player.currentSlot], window.gameInstance.zoomLevel);
        }

        function spawnCrate() {
            let x, y, valid = false, attempts = 0;
            while(!valid && attempts < 50) {
                x = Math.random() * (MAP_W - 200) + 100; y = Math.random() * (MAP_H - 200) + 100;
                valid = true;
                for(let w of walls) { if(x > w.x - 30 && x < w.x + w.w + 30 && y > w.y - 30 && y < w.y + w.h + 30) { valid = false; break; } }
                attempts++;
            }
            if(valid) {
                const r = Math.random(); let type = 'smg';
                if(r > 0.85) type = 'vest'; else if(r > 0.7) type = 'medkit'; else if(r > 0.55) type = 'sniper'; else if(r > 0.4) type = 'shotgun'; else if(r > 0.25) type = 'rifle';
                crates.push({ x, y, type });
            }
        }

        function updateWeaponUI() {
            weaponInventory.innerHTML = '';
            player.inventory.forEach((w, index) => {
                const slot = document.createElement('div');
                slot.className = 'weapon-slot' + (index === player.currentSlot ? ' active' : '');
                if (w && weapons[w]) {
                    slot.innerHTML = svgs[w] || '🔫';
                    slot.onclick = () => {
                        player.currentSlot = index; player.ammo = weapons[w].maxAmmo; player.isReloading = false;
                        updateWeaponUI(); updateCameraZoom();
                        if (weapons[w].name === 'SNIPER') zoomUi.style.display = 'flex'; else zoomUi.style.display = 'none';
                    };
                } else { slot.innerHTML = `EMPTY`; }
                weaponInventory.appendChild(slot);
            });
        }

        function getCurrentWeapon() { const w = player.inventory[player.currentSlot]; return w ? weapons[w] : weapons.pistol; }

        function resetGame() {
            player.health = player.maxHealth; player.armor = 0; player.x = MAP_W/2; player.y = MAP_H/2;
            player.inventory = ['pistol', null, null]; player.currentSlot = 0; player.ammo = weapons['pistol'].maxAmmo; player.isReloading = false;
            window.gameInstance.zoomLevel = 1; zoomUi.style.display = 'none'; shakeTime = 0;
            bullets = []; window.gameInstance.bullets = bullets; bombs = []; crates = [];
            for(let i=0; i<10; i++) spawnCrate();
            healthFill.style.width = '100%'; armorFill.style.width = '0%'; scoreDisplay.innerText = '💀 0';
            updateWeaponUI(); updateCameraZoom();
        }

        function shootBullet() {
            if (!isAlive || player.isReloading) return;
            const w = getCurrentWeapon();
            if (player.shootTimer > 0) return;
            if (player.ammo <= 0) { sound.play("empty"); return; }
            player.shootTimer = w.cooldown; player.ammo--; shakeTime = w.shake;
            sound.play(player.inventory[player.currentSlot] || "pistol", 0.6);
            
            for (let i = 0; i < w.count; i++) {
                const sa = player.aimAngle + (Math.random() - 0.5) * w.spread;
                const sx = player.x + Math.cos(sa) * (player.radius + 6); 
                const sy = player.y + Math.sin(sa) * (player.radius + 6);
                const bId = Date.now() + Math.random().toString(36).substr(2, 5);
                
                bullets.push({ id: bId, x: sx, y: sy, vx: Math.cos(sa) * w.speed, vy: Math.sin(sa) * w.speed, radius: w.size, friendly: true, life: w.range / w.speed, dmg: w.dmg, color: w.color });
                
                if (socket && socket.connected) {
                    socket.emit("shoot", {
                        bulletId: bId,
                        bullet: { x: sx, y: sy, vx: Math.cos(sa) * w.speed, vy: Math.sin(sa) * w.speed, dmg: w.dmg, weapon: player.inventory[player.currentSlot] || 'pistol' }
                    });
                }
            }
        }

        function update() {
            if (gameEnded) return;
            if (!isAlive) return;

            if (shakeTime > 0) shakeTime--;
            if (player.ammo <= 0 && !player.isReloading) window.gameInstance.reloadWeapon();
            if (player.isReloading) { player.reloadTimer--; if (player.reloadTimer <= 0) { player.isReloading = false; player.ammo = getCurrentWeapon().maxAmmo; } }
            player.inBush = false; for (let b of bushes) { if (Math.hypot(player.x - b.x, player.y - b.y) < b.r) { player.inBush = true; break; } }
            if (shootAnalogActive && (Math.abs(shootVector.x) > 0.1 || Math.abs(shootVector.y) > 0.1)) player.aimAngle = Math.atan2(shootVector.y, shootVector.x);
            else if (moveAnalogActive && (Math.abs(moveVector.x) > 0.1 || Math.abs(moveVector.y) > 0.1)) player.aimAngle = Math.atan2(moveVector.y, moveVector.x);
            else { const mx = camera.x + (mouseX - canvas.width/2) / camera.zoom; const my = camera.y + (mouseY - canvas.height/2) / camera.zoom; player.aimAngle = Math.atan2(my - player.y, mx - player.x); }

            let moveX = 0, moveY = 0;
            if (moveAnalogActive) { moveX = moveVector.x * player.speed; moveY = moveVector.y * player.speed; }
            else { if (keys.a) moveX -= 1; if (keys.d) moveX += 1; if (keys.w) moveY -= 1; if (keys.s) moveY += 1; if (moveX !== 0 || moveY !== 0) { const len = Math.hypot(moveX, moveY); moveX = (moveX / len) * player.speed; moveY = (moveY / len) * player.speed; } }

            player.vx = moveX; player.vy = moveY;
            player.x = Math.max(player.radius, Math.min(MAP_W - player.radius, player.x + moveX)); player.y = Math.max(player.radius, Math.min(MAP_H - player.radius, player.y + moveY));
            C.resolveWallCollisions(player, walls);
            camera.x += (player.x - camera.x) * 0.1; camera.y += (player.y - camera.y) * 0.1;
            if (player.invincible) { player.invincibleTimer--; if (player.invincibleTimer <= 0) player.invincible = false; }
            if (player.shootTimer > 0) player.shootTimer--;
            if (shootAnalogActive && (Math.abs(shootVector.x) > 0.25 || Math.abs(shootVector.y) > 0.25)) shootBullet();

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--;
                let hitWall = false; for (let w of walls) { if (C.rectCollide(b.x, b.y, b.radius, w)) { hitWall = true; break; } }
                if (hitWall || b.life <= 0) { bullets.splice(i, 1); continue; }

                if (b.friendly) {
                    if (socket && socket.connected) {
                        let hitAny = false;
                        for (const [sid, rp] of remotePlayers) {
                            if (!rp.alive) continue;
                            if (Math.hypot(b.x - rp.x, b.y - rp.y) < b.radius + 18) {
                                socket.emit("shoot-hit", {
                                    targetSocketId: sid,
                                    bulletId: b.id,
                                    bullet: { x: b.x, y: b.y, dmg: b.dmg }
                                });
                                bullets.splice(i, 1);
                                hitAny = true;
                                break;
                            }
                        }
                        if (hitAny) continue;
                    }
                } else {
                    if (isAlive && Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.radius) {
                        bullets.splice(i, 1);
                    }
                }
            }

            for (let i = crates.length - 1; i >= 0; i--) {
                const c = crates[i];
                if (Math.hypot(c.x - player.x, c.y - player.y) < player.radius + 25) {
                    sound.play("pickup", 0.5);
                    if (c.type === 'vest') { player.armor = Math.min(player.maxArmor, player.armor + 50); armorFill.style.width = (player.armor / player.maxArmor * 100) + '%'; }
                    else if (c.type === 'medkit') { player.health = Math.min(player.maxHealth, player.health + 40); healthFill.style.width = (player.health / player.maxHealth * 100) + '%'; }
                    else {
                        let slot = player.inventory.indexOf(null); if (slot === -1) slot = player.currentSlot;
                        player.inventory[slot] = c.type; player.currentSlot = slot; player.ammo = weapons[c.type].maxAmmo; player.isReloading = false;
                        updateWeaponUI(); updateCameraZoom();
                    }
                    crates.splice(i, 1);
                }
            }

            if (socket && socket.connected) {
                const now = Date.now();
                if (now - lastPositionSend > 66) {
                    socket.emit("position", {
                        x: player.x, y: player.y,
                        angle: player.aimAngle,
                        health: player.health,
                        alive: isAlive
                    });
                    lastPositionSend = now;
                }
            }
        }

        function drawCrateIcon(c, x, y) {
            ctx.fillStyle = '#fff'; ctx.font = '16px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            if (c === 'vest') { ctx.fillStyle = '#88c0d0'; ctx.fillText('🛡️', x, y); }
            else if (c === 'medkit') { ctx.fillStyle = '#bf616a'; ctx.fillText('➕', x, y); }
            else { ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fillStyle = '#ebcb8b'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            let shakeX = 0, shakeY = 0;
            if (shakeTime > 0) { shakeX = (Math.random() - 0.5) * shakeTime; shakeY = (Math.random() - 0.5) * shakeTime; }
            ctx.translate(canvas.width / 2 + shakeX, canvas.height / 2 + shakeY);
            ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

            const theme = window.currentTheme || {};
            const wallCol = theme.wallColor || '#34495e';
            const wallBorder = theme.wallBorder || '#2c3e50';
            const bushCol = theme.bushColor || '#27ae60';
            const groundTint = theme.groundTint || '#2b4a66';
            const groundLight = theme.groundLight || '#7fa9c7';

            ctx.fillStyle = groundTint; ctx.fillRect(0, 0, MAP_W, MAP_H);
            ctx.strokeStyle = groundLight; ctx.lineWidth = 2; ctx.globalAlpha = 0.15;
            for (let i = 0; i < MAP_W; i += 100) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, MAP_H); ctx.stroke(); }
            for (let i = 0; i < MAP_H; i += 100) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(MAP_W, i); ctx.stroke(); }
            ctx.globalAlpha = 1.0; ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 10; ctx.strokeRect(0, 0, MAP_W, MAP_H);

            walls.forEach(w => { ctx.fillStyle = wallCol; ctx.fillRect(w.x, w.y, w.w, w.h); ctx.strokeStyle = wallBorder; ctx.lineWidth = 4; ctx.strokeRect(w.x, w.y, w.w, w.h); });
            bushes.forEach(b => { ctx.fillStyle = bushCol; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1.0; });
            crates.forEach(c => { ctx.fillStyle = '#2e3440'; ctx.fillRect(c.x - 18, c.y - 18, 36, 36); ctx.strokeStyle = '#4c566a'; ctx.lineWidth = 4; ctx.strokeRect(c.x - 18, c.y - 18, 36, 36); drawCrateIcon(c.type, c.x, c.y); });
            bullets.forEach(b => { ctx.strokeStyle = b.color; ctx.lineWidth = b.radius; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(b.x - b.vx * 1.5, b.y - b.vy * 1.5); ctx.lineTo(b.x, b.y); ctx.stroke(); });

            for (const [sid, rp] of remotePlayers) {
                if (!rp.alive) continue;
                C.drawStickman(ctx, rp.x, rp.y, rp.angle || 0, { isPlayer: false, weaponType: 'pistol', inBush: false });
                ctx.save();
                ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
                const nameW = ctx.measureText(rp.username).width;
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(rp.x - nameW/2 - 6, rp.y - 55, nameW + 12, 20);
                ctx.fillStyle = rp.team === 1 ? '#60a5fa' : '#f87171'; ctx.fillText(rp.username, rp.x, rp.y - 40);
                ctx.restore();
            }

            if (isAlive) {
                C.drawStickman(ctx, player.x, player.y, player.aimAngle, { isPlayer: true, weaponType: player.inventory[player.currentSlot] || 'pistol', playerInBush: player.inBush, playerColor: player.color });
            }

            ctx.restore();
        }

        function gameLoop() {
            try { update(); draw(); } catch(e) { console.error("Loop error:", e); }
            requestAnimationFrame(gameLoop);
        }

        C.setupJoystick(joystickBase, joystickKnob, () => { moveAnalogActive = true; }, (x, y) => { moveVector = { x, y }; }, () => { moveAnalogActive = false; moveVector = { x: 0, y: 0 }; });
        C.setupJoystick(shootBase, shootKnob, () => { shootAnalogActive = true; shootBullet(); }, (x, y) => { shootVector = { x, y }; }, () => { shootAnalogActive = false; shootVector = { x: 0, y: 0 }; });

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase(); if (['w','a','s','d'].includes(key)) keys[key] = true;
            if (key === ' ') shootBullet();
        });
        window.addEventListener('keyup', (e) => { const key = e.key.toLowerCase(); if (['w','a','s','d'].includes(key)) keys[key] = false; });
        canvas.addEventListener('mousemove', (e) => { const rect = canvas.getBoundingClientRect(); mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top; });
        canvas.addEventListener('mousedown', (e) => { if (e.button === 0) shootBullet(); });

        walls = window.walls.length ? window.walls : [];
        bushes = window.bushes.length ? window.bushes : [];
        resize(); resetGame(); gameLoop();
        document.body.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    })();
</script>
</body>
</html>

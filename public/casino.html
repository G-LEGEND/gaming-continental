<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casino - Gaming Continental</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
      padding-bottom: 90px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn:active { background: rgba(255,255,255,0.2); }
    h1 { margin: 0; font-size: 24px; }
    
    .games-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    
    .game-card {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      text-decoration: none;
      color: white;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .game-card:active {
      transform: scale(0.98);
    }
    
    .game-icon {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    /* SVG Icon Styles */
    .game-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    
    .game-info h3 { margin: 0 0 5px 0; font-size: 20px; }
    .game-info p { margin: 0; color: #94a3b8; font-size: 14px; }
    
    .play-badge {
      margin-left: auto;
      background: #22c55e;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <h1>Casino Lobby</h1>
  </div>

  <div class="games-grid">
    
    <!-- Game: Ghost Racer -->
    <a href="ghost-racer.html" class="game-card">
      <div class="game-icon">
        <svg viewBox="0 0 24 24"><path d="M9 10h.01"></path><path d="M15 10h.01"></path><path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"></path></svg>
      </div>
      <div class="game-info">
        <h3>Ghost Racer</h3>
        <p>Type fast to beat the ghost!</p>
      </div>
      <div class="play-badge">PLAY</div>
    </a>

    <!-- Coming Soon: Dice Roll -->
    <div class="game-card" style="opacity: 0.5; cursor: not-allowed;" onclick="alert('Coming soon!')">
      <div class="game-icon" style="background: linear-gradient(135deg, #f59e0b, #ef4444);">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle></svg>
      </div>
      <div class="game-info">
        <h3>Dice Roll</h3>
        <p>Predict the roll and win big</p>
      </div>
      <div class="play-badge" style="background: #64748b;">SOON</div>
    </div>

    <!-- Coming Soon: Blackjack -->
    <div class="game-card" style="opacity: 0.5; cursor: not-allowed;" onclick="alert('Coming soon!')">
      <div class="game-icon" style="background: linear-gradient(135deg, #10b981, #3b82f6);">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="20" rx="2" ry="2"></rect><rect x="8" y="2" width="14" height="20" rx="2" ry="2"></svg>
      </div>
      <div class="game-info">
        <h3>Blackjack</h3>
        <p>Beat the dealer to 21</p>
      </div>
      <div class="play-badge" style="background: #64748b;">SOON</div>
    </div>

  </div>

  <div id="footerContainer"></div>

  <script>
    // ✅ Load Footer
    document.addEventListener("DOMContentLoaded", function() {
      fetch('footer.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('footerContainer').innerHTML = html;
          if (typeof setupFooter === 'function') setupFooter();
        });
    });
  </script>

  <!-- ✅ Load footer script -->
  <script src="footer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Scores</title>
  <style>
    /* Your existing CSS styles */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: #333; padding-bottom: 80px; }
    .header { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 20px 16px; border-bottom-left-radius: 24px; border-bottom-right-radius: 24px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; color: #2d3748; margin-bottom: 4px; }
    .welcome-text { color: #718096; font-size: 0.9rem; }
    .center { padding: 0 16px; width: 100%; max-width: 400px; margin: 0 auto; }
    .scores-container { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
    .score-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; justify-content: space-between; align-items: center; transition: all 0.3s ease; }
    .tournament-name { font-weight: 600; color: #2d3748; font-size: 1rem; flex: 1; }
    .watch-btn { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 12px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); white-space: nowrap; margin-left: 16px; border: none; cursor: pointer; display: inline-block; text-align: center; }
    .debug-info { background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 8px; margin: 10px 0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <h1>📺 Live Scores - DEBUG MODE</h1>
    <div class="welcome-text">Testing connection to server</div>
  </div>

  <!-- Debug Info -->
  <div class="center">
    <div class="debug-info" id="debugInfo">
      Initializing debug...
    </div>
  </div>

  <!-- Main Content -->
  <div class="center">
    <div class="scores-container" id="scoreList">
      <!-- Scores will be loaded here -->
    </div>
  </div>

  <script>
    // Debug function to update the debug info
    function updateDebugInfo(message) {
      const debugEl = document.getElementById('debugInfo');
      const timestamp = new Date().toLocaleTimeString();
      debugEl.innerHTML += `<br>[${timestamp}] ${message}`;
      console.log(`[DEBUG] ${message}`);
    }

    // Use current domain or fallback to your Render URL
    const API_BASE = window.location.origin === 'file://' 
      ? 'https://gaming-continental.onrender.com' 
      : window.location.origin;

    updateDebugInfo(`API_BASE: ${API_BASE}`);
    updateDebugInfo(`Full URL: ${API_BASE}/livescore`);

    async function loadScores() {
      const list = document.getElementById("scoreList");
      
      updateDebugInfo('Starting loadScores() function');
      
      // Show loading state
      list.innerHTML = `
        <div style="text-align: center; padding: 60px 20px; color: #718096;">
          <div style="border: 3px solid #e2e8f0; border-top: 3px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
          <div>Loading live scores...</div>
          <div style="font-size: 12px; margin-top: 10px;">Testing connection to: ${API_BASE}/livescore</div>
        </div>
      `;

      try {
        updateDebugInfo('Making fetch request...');
        
        // Test the connection first with a simple fetch
        const testStart = Date.now();
        const res = await fetch(`${API_BASE}/livescore`);
        const testEnd = Date.now();
        
        updateDebugInfo(`Fetch completed in ${testEnd - testStart}ms`);
        updateDebugInfo(`Response status: ${res.status} ${res.statusText}`);
        updateDebugInfo(`Response OK: ${res.ok}`);
        
        if (!res.ok) {
          updateDebugInfo(`❌ Server returned error: ${res.status}`);
          const errorText = await res.text();
          updateDebugInfo(`Error response: ${errorText}`);
          throw new Error(`Server error: ${res.status} - ${res.statusText}`);
        }
        
        updateDebugInfo('✅ Response OK, parsing JSON...');
        const scores = await res.json();
        updateDebugInfo(`✅ JSON parsed successfully, got ${scores.length} scores`);
        
        // Clear loading state
        list.innerHTML = "";
        
        if (!scores || scores.length === 0) {
          updateDebugInfo('No scores found, showing empty state');
          list.innerHTML = `
            <div style="text-align: center; padding: 60px 20px; color: #718096;">
              <div style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;">📺</div>
              <h3 style="font-size: 1.2rem; margin-bottom: 8px; color: #2d3748;">No Live Matches</h3>
              <p>Check back later for live tournaments</p>
              <button onclick="loadScores()" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 10px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; margin-top: 10px;">
                🔄 Refresh
              </button>
            </div>
          `;
          return;
        }

        updateDebugInfo(`Displaying ${scores.length} scores`);
        // Display each live score
        scores.forEach(score => {
          const scoreCard = document.createElement("div");
          scoreCard.className = "score-card";
          
          const tournamentName = score.tournament || 'Live Match';
          const streamLink = score.link || '#';
          
          scoreCard.innerHTML = `
            <div class="tournament-name">${tournamentName}</div>
            <a href="${streamLink}" target="_blank" rel="noopener noreferrer" class="watch-btn">
              📺 Watch Live
            </a>
          `;
          list.appendChild(scoreCard);
        });

        updateDebugInfo('✅ Page loaded successfully!');

      } catch (err) {
        updateDebugInfo(`❌ CATCH BLOCK: ${err.message}`);
        updateDebugInfo(`❌ Error name: ${err.name}`);
        updateDebugInfo(`❌ Error stack: ${err.stack}`);
        
        let errorMessage = "Please check your connection";
        if (err.message.includes('timeout')) {
          errorMessage = "Request timeout - server is taking too long to respond";
        } else if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
          errorMessage = "Network error - cannot reach the server";
        } else if (err.message.includes('Server error')) {
          errorMessage = "Server is experiencing issues";
        }
        
        list.innerHTML = `
          <div style="text-align: center; padding: 60px 20px; color: #718096;">
            <div style="font-size: 3rem; margin-bottom: 16px; opacity: 0.5;">❌</div>
            <h3 style="font-size: 1.2rem; margin-bottom: 8px; color: #2d3748;">Failed to Load</h3>
            <p>${errorMessage}</p>
            <div style="font-size: 0.8rem; color: #9ca3af; margin-top: 8px;">Error: ${err.message}</div>
            <button onclick="loadScores()" style="background: linear-gradient(135deg, #10b981, #059669); color: white; padding: 10px 20px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; margin-top: 10px;">
              🔄 Try Again
            </button>
          </div>
        `;
      }
    }

    // Add CSS for loading spinner
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);

    // Initialize when page loads
    document.addEventListener("DOMContentLoaded", function() {
      updateDebugInfo('DOM Content Loaded');
      updateDebugInfo(`Current URL: ${window.location.href}`);
      loadScores();
    });
  </script>
</body>
</html>

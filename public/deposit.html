<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deposit Funds</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ✅ Load Paystack Inline JS -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      padding-bottom: 90px;
      color: #333;
      line-height: 1.5;
    }
    .container { max-width: 100%; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; color: white; }
    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header h1 svg { width: 32px; height: 32px; stroke: white; }
    .header p { font-size: 1rem; opacity: 0.9; }
    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2d3748;
      font-size: 1rem;
    }
    .input-wrapper { position: relative; }
    .input-wrapper::before {
      content: '₦';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #4a5568;
      font-weight: 600;
      z-index: 2;
      font-size: 1.1rem;
    }
    .form-input {
      width: 100%;
      padding: 16px 16px 16px 40px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      background: white;
      transition: all 0.3s ease;
    }
    .form-input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }
    .form-input::placeholder { color: #a0aec0; font-weight: normal; }
    .quick-amounts {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .quick-btn {
      padding: 10px 4px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #1e293b;
    }
    .quick-btn:active { background: #4f46e5; color: white; transform: scale(0.95); }
    .btn {
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-paystack {
      background: linear-gradient(135deg, #00c3f7, #0ba4e0);
      color: white;
      box-shadow: 0 4px 15px rgba(11, 164, 224, 0.4);
    }
    .btn-paystack:active { transform: translateY(2px); }
    .info-box {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 14px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 13px;
      color: #1e40af;
      line-height: 1.5;
    }
    .hidden { display: none; }
    .loading {
      opacity: 0.7;
      pointer-events: none;
      position: relative;
    }
    .loading::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 20px; height: 20px;
      margin: -10px 0 0 -10px;
      border: 2px solid #fff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #10b981;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      z-index: 1000;
      font-weight: 600;
      transform: translateX(400px);
      transition: transform 0.3s ease;
      max-width: 320px;
      font-size: 14px;
    }
    .toast.show { transform: translateX(0); }
    .toast.error { background: #dc2626; }
    @media (min-width: 768px) { .container { max-width: 420px; } }
    @media (max-width: 380px) {
      .card { padding: 20px; }
      .btn { padding: 16px 20px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3h12l4 6-10 12L2 9z"></path>
        </svg>
        Deposit Funds
      </h1>
      <p>Add money instantly with Paystack</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">Enter Amount (₦)</label>
        <div class="input-wrapper">
          <input type="number" id="depositAmount" class="form-input" placeholder="1000" min="100" required />
        </div>
        <div class="quick-amounts">
          <button class="quick-btn" onclick="setAmount(500)">₦500</button>
          <button class="quick-btn" onclick="setAmount(1000)">₦1K</button>
          <button class="quick-btn" onclick="setAmount(2000)">₦2K</button>
          <button class="quick-btn" onclick="setAmount(5000)">₦5K</button>
          <button class="quick-btn" onclick="setAmount(10000)">₦10K</button>
          <button class="quick-btn" onclick="setAmount(20000)">₦20K</button>
          <button class="quick-btn" onclick="setAmount(50000)">₦50K</button>
          <button class="quick-btn" onclick="setAmount(100000)">₦100K</button>
        </div>
        <div style="text-align: center; margin-top: 12px;">
          <small style="color: #718096;">Minimum deposit: ₦100</small>
        </div>
      </div>

      <button class="btn btn-paystack" onclick="payWithPaystack(this)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
        Pay with Paystack
      </button>

      <div class="info-box">
        <strong>Secure Payment:</strong> Your card details are safe. Paystack handles all transactions. Your balance will be credited instantly after payment.
      </div>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script>
    const API_BASE = window.location.origin;
    const userId = localStorage.getItem("userId");

    if (!userId) {
      alert("Please login first");
      window.location.href = "index.html";
    }

    // ✅ Load Paystack Public Key from backend
    let PAYSTACK_PUBLIC_KEY = "";
    fetch(`${API_BASE}/paystack/public-key`)
      .then(r => r.json())
      .then(d => { 
        PAYSTACK_PUBLIC_KEY = d.key; 
        console.log("✅ Paystack Public Key loaded");
      })
      .catch(() => showToast("Paystack key missing", true));

    function showToast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = `toast ${isError ? 'error' : ''}`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => document.body.removeChild(toast), 300);
      }, 4000);
    }

    function setAmount(val) {
      document.getElementById("depositAmount").value = val;
    }

    async function payWithPaystack(btnElement) {
      const amount = Number(document.getElementById("depositAmount").value);
      if (!amount || amount < 100) {
        return showToast("Minimum deposit is ₦100", true);
      }

      if (!PAYSTACK_PUBLIC_KEY) {
        return showToast("Payment system not ready. Try again.", true);
      }

      // Get user's email
      let userEmail;
      try {
        const res = await fetch(`${API_BASE}/auth/me?userId=${userId}`);
        if (!res.ok) throw new Error("Could not load user");
        const user = await res.json();
        userEmail = user.email;
      } catch (err) {
        return showToast("Failed to load user info", true);
      }

      btnElement.classList.add("loading");

      const handler = PaystackPop.setup({
        key: PAYSTACK_PUBLIC_KEY,
        email: userEmail,
        amount: amount * 100, // Paystack uses kobo
        currency: "NGN",
        ref: `DEP_${Date.now()}_${userId.slice(-6)}`,
        metadata: {
          userId: userId,
          custom_fields: [
            { display_name: "User", variable_name: "user_id", value: userId }
          ]
        },
        callback: function(response) {
          verifyPayment(response.reference);
        },
        onClose: function() {
          btnElement.classList.remove("loading");
          showToast("Payment cancelled", true);
        }
      });

      handler.openIframe();
    }

    async function verifyPayment(reference) {
      try {
        const res = await fetch(`${API_BASE}/paystack/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reference, userId })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Verification failed");

        showToast(`₦${data.amount.toLocaleString()} added to your balance!`);
        document.getElementById("depositAmount").value = "";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 2000);
      } catch (err) {
        console.error("Verify error:", err);
        showToast(err.message || "Payment verification failed", true);
      }
    }

    document.getElementById('depositAmount').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') payWithPaystack(document.querySelector('.btn-paystack'));
    });

    document.addEventListener("DOMContentLoaded", function() {
      fetch('footer.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('footerContainer').innerHTML = html;
          if (typeof setupFooter === 'function') setupFooter();
        });
    });
  </script>

  <script src="footer.js"></script>
</body>
</html>

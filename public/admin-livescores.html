<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Live Scores</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root{
      --accent:#007BFF;
      --card:#0f172a;
      --muted:#94a3b8;
    }

    body { background: #0b1220; color: #e6eef8; font-family: Inter, "Segoe UI", Arial, sans-serif; margin: 0; padding: 24px 12px; }
    .center { max-width: 920px; margin: 30px auto; }

    h1 { text-align: center; margin-bottom: 22px; font-weight: 700; font-size: 22px; color: #fff; }

    /* ---------- Form layout ---------- */
    form#liveForm {
      display: grid;
      grid-template-columns: 3fr 5fr auto; /* title (3), link (5), small button */
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    /* Big inputs */
    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: #fff;
      font-size: 16px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
    }
    input::placeholder { color: #98a2b3; }

    /* Upload button: intentionally small */
    button.upload-btn {
      padding: 10px 14px;
      border-radius: 8px;
      background: linear-gradient(135deg,#ffd54a,#ffb84d);
      color: #0b1220;
      border: none;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,185,60,0.12);
      transition: transform .12s ease, box-shadow .12s ease;
      min-width: 92px;
      justify-self: end;
    }
    button.upload-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,185,60,0.18); }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(2,6,23,0.6);
    }
    thead th {
      background: #0b1220;
      color: var(--muted);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      color: #e6eef8;
    }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    a.view-link {
      display: inline-block;
      padding: 8px 12px;
      background: rgba(0,123,255,0.12);
      color: var(--accent);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .delete-btn:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Status Messages */
    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }

    .status-success {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 20px;
      color: var(--muted);
    }

    /* Responsive: stack fields on small screens */
    @media (max-width: 760px) {
      form#liveForm {
        grid-template-columns: 1fr;
      }
      button.upload-btn { justify-self: stretch; width: 100%; }
      .center { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>⚽ Manage Live Scores</h1>

    <div id="statusMessage"></div>

    <form id="liveForm">
      <input type="text" id="tournament" placeholder="Tournament name (e.g. Africa Cup 2025)" required />
      <input type="url" id="link" placeholder="Live score URL (paste full link, e.g. https://... )" required />
      <button class="upload-btn" type="submit" id="submitBtn">Upload</button>
    </form>

    <div id="scoresContainer">
      <table>
        <thead>
          <tr>
            <th>Tournament</th>
            <th>Live Link</th>
            <th style="width:120px">Action</th>
          </tr>
        </thead>
        <tbody id="liveTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ✅ FIXED: Always use Render backend (Netlify frontend → Render backend)
    const API_BASE = 'https://gaming-continental.onrender.com';

    console.log('🌐 Admin API Base URL:', API_BASE);

    function showMessage(message, type = 'success') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.innerHTML = `
        <div class="status-message status-${type}">
          ${message}
        </div>
      `;
      setTimeout(() => {
        statusEl.innerHTML = '';
      }, 5000);
    }

    function setLoading(loading) {
      const submitBtn = document.getElementById('submitBtn');
      if (loading) {
        submitBtn.innerHTML = 'Uploading...';
        submitBtn.disabled = true;
      } else {
        submitBtn.innerHTML = 'Upload';
        submitBtn.disabled = false;
      }
    }

    // Simple timeout function for browser compatibility
    function fetchWithTimeout(url, options = {}, timeout = 10000) {
      return new Promise((resolve, reject) => {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => {
          controller.abort();
          reject(new Error('Request timeout'));
        }, timeout);

        fetch(url, {
          ...options,
          signal: controller.signal
        })
          .then(resolve)
          .catch(reject)
          .finally(() => clearTimeout(timeoutId));
      });
    }

    async function loadScores() {
      const tbody = document.getElementById("liveTable");
      
      // Show loading state
      tbody.innerHTML = `
        <tr>
          <td colspan="3" style="text-align: center; padding: 40px; color: var(--muted);">
            <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid var(--muted); border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div>Loading live scores...</div>
          </td>
        </tr>
      `;

      try {
        console.log('📡 Admin loading scores from:', `${API_BASE}/livescore`);
        
        const res = await fetchWithTimeout(
          `${API_BASE}/livescore`,
          {
            method: 'GET',
            headers: {
              'Content-Type': 'application/json',
            }
          },
          10000
        );
        
        if (!res.ok) {
          console.error('❌ Admin - Server response not OK:', res.status);
          throw new Error(`Failed to load: ${res.status} ${res.statusText}`);
        }
        
        const scores = await res.json();
        console.log('✅ Admin - Scores loaded:', scores);
        
        tbody.innerHTML = "";
        
        if (!scores || scores.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="text-align: center; padding: 40px; color: var(--muted);">
                No live scores found. Add your first one above.
              </td>
            </tr>
          `;
          return;
        }

        scores.forEach(s => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escapeHtml(s.tournament)}</td>
            <td>
              <a class="view-link" href="${s.link}" target="_blank" rel="noopener noreferrer">
                Open live
              </a>
            </td>
            <td>
              <button class="delete-btn" onclick="deleteScore('${s._id}')">
                Delete
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error("❌ Admin - Failed to load livescores", err);
        tbody.innerHTML = `
          <tr>
            <td colspan="3" style="text-align: center; padding: 40px; color: #ef4444;">
              Error loading scores: ${err.message}
              <br><br>
              <button class="delete-btn" onclick="loadScores()" style="background: #3b82f6;">
                🔄 Retry
              </button>
            </td>
          </tr>
        `;
      }
    }

    document.getElementById("liveForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const tournament = document.getElementById("tournament").value.trim();
      const link = document.getElementById("link").value.trim();
      
      if (!tournament || !link) {
        showMessage('Both tournament name and link are required', 'error');
        return;
      }

      // Basic URL validation
      try {
        new URL(link);
      } catch (urlError) {
        showMessage('Please enter a valid URL (e.g., https://example.com)', 'error');
        return;
      }

      setLoading(true);

      try {
        console.log('📤 Admin adding live score:', { tournament, link });
        const res = await fetchWithTimeout(
          `${API_BASE}/livescore`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ tournament, link })
          },
          10000
        );

        const result = await res.json().catch(() => ({ error: 'Invalid server response' }));

        if (!res.ok) {
          throw new Error(result.error || `Server error: ${res.status}`);
        }

        showMessage('✅ Live score added successfully!');
        loadScores();
        e.target.reset();
        
      } catch (err) {
        console.error('❌ Admin upload error:', err);
        showMessage(`Upload failed: ${err.message}`, 'error');
      } finally {
        setLoading(false);
      }
    }

    async function deleteScore(id) {
      if (!confirm("Are you sure you want to delete this live score?")) return;

      try {
        console.log('🗑️ Admin deleting score:', id);
        const res = await fetchWithTimeout(
          `${API_BASE}/livescore/${id}`, 
          { 
            method: "DELETE" 
          },
          10000
        );

        const result = await res.json().catch(() => ({ error: 'Invalid server response' }));

        if (!res.ok) {
          throw new Error(result.error || `Delete failed: ${res.status}`);
        }

        showMessage('✅ Live score deleted successfully!');
        loadScores();
        
      } catch (err) {
        console.error('❌ Admin delete error:', err);
        showMessage(`Delete failed: ${err.message}`, 'error');
      }
    }

    // Helper function to escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Add CSS for loading spinner
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);

    // Initialize when page loads
    document.addEventListener("DOMContentLoaded", function() {
      console.log('🚀 Admin Live Scores page loaded');
      console.log('🌐 API Base:', API_BASE);
      loadScores();
    });
  </script>
</body>
</html>

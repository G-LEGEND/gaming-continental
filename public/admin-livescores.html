<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin - Live Scores</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root{
      --accent:#007BFF;
      --card:#0f172a;
      --muted:#94a3b8;
    }

    body { background: #0b1220; color: #e6eef8; font-family: Inter, "Segoe UI", Arial, sans-serif; margin: 0; padding: 24px 12px; }
    .center { max-width: 920px; margin: 30px auto; }

    h1 { text-align: center; margin-bottom: 22px; font-weight: 700; font-size: 22px; color: #fff; }

    /* ---------- Form layout ---------- */
    form#liveForm {
      display: grid;
      grid-template-columns: 3fr 5fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
    }

    input[type="text"],
    input[type="url"] {
      width: 100%;
      padding: 16px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.02);
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input::placeholder { color: #98a2b3; }

    button.upload-btn {
      padding: 10px 14px;
      border-radius: 8px;
      background: linear-gradient(135deg,#ffd54a,#ffb84d);
      color: #0b1220;
      border: none;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255,185,60,0.12);
      transition: transform .12s ease, box-shadow .12s ease;
      min-width: 92px;
      justify-self: end;
    }
    button.upload-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,185,60,0.18); }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(2,6,23,0.6);
    }
    thead th {
      background: #0b1220;
      color: var(--muted);
      font-weight: 600;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      color: #e6eef8;
    }
    tbody tr:hover { background: rgba(255,255,255,0.02); }

    a.view-link {
      display: inline-block;
      padding: 8px 12px;
      background: rgba(0,123,255,0.12);
      color: var(--accent);
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
      padding: 8px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }
    .delete-btn:hover { opacity: 0.95; transform: translateY(-1px); }

    /* Status Messages */
    .status-message {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-weight: 600;
    }

    .status-success {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .debug-info {
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }

    /* Responsive */
    @media (max-width: 760px) {
      form#liveForm {
        grid-template-columns: 1fr;
      }
      button.upload-btn { justify-self: stretch; width: 100%; }
      .center { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="center">
    <h1>⚽ Manage Live Scores - DEBUG MODE</h1>

    <!-- Debug Info -->
    <div class="debug-info" id="debugInfo">
      Initializing debug...
    </div>

    <div id="statusMessage"></div>

    <form id="liveForm">
      <input type="text" id="tournament" placeholder="Tournament name (e.g. Africa Cup 2025)" required />
      <input type="url" id="link" placeholder="Live score URL (paste full link)" required />
      <button class="upload-btn" type="submit" id="submitBtn">Upload</button>
    </form>

    <div id="scoresContainer">
      <table>
        <thead>
          <tr>
            <th>Tournament</th>
            <th>Live Link</th>
            <th style="width:120px">Action</th>
          </tr>
        </thead>
        <tbody id="liveTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    // ✅ FIXED: Always use Render backend
    const API_BASE = 'https://gaming-continental.onrender.com';

    // Debug function to update the debug info
    function updateDebugInfo(message) {
      const debugEl = document.getElementById('debugInfo');
      const timestamp = new Date().toLocaleTimeString();
      debugEl.innerHTML += `<br>[${timestamp}] ${message}`;
      console.log(`[DEBUG] ${message}`);
      
      // Auto-scroll to bottom
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    function showMessage(message, type = 'success') {
      const statusEl = document.getElementById('statusMessage');
      statusEl.innerHTML = `
        <div class="status-message status-${type}">
          ${message}
        </div>
      `;
      setTimeout(() => {
        statusEl.innerHTML = '';
      }, 5000);
    }

    function setLoading(loading) {
      const submitBtn = document.getElementById('submitBtn');
      if (loading) {
        submitBtn.innerHTML = 'Uploading...';
        submitBtn.disabled = true;
      } else {
        submitBtn.innerHTML = 'Upload';
        submitBtn.disabled = false;
      }
    }

    async function loadScores() {
      const tbody = document.getElementById("liveTable");
      
      updateDebugInfo('Starting loadScores() function');
      
      // Show loading state
      tbody.innerHTML = `
        <tr>
          <td colspan="3" style="text-align: center; padding: 40px; color: var(--muted);">
            <div style="display: inline-block; width: 20px; height: 20px; border: 2px solid var(--muted); border-top: 2px solid transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <div>Loading live scores...</div>
          </td>
        </tr>
      `;

      try {
        updateDebugInfo('📡 Making fetch request to: ' + API_BASE + '/livescore');
        
        const res = await fetch(`${API_BASE}/livescore`);
        
        updateDebugInfo('✅ Fetch completed, status: ' + res.status);
        
        if (!res.ok) {
          updateDebugInfo('❌ Server returned error: ' + res.status);
          const errorText = await res.text();
          updateDebugInfo('❌ Error response: ' + errorText);
          throw new Error(`Server error: ${res.status} - ${res.statusText}`);
        }
        
        const scores = await res.json();
        updateDebugInfo(`✅ JSON parsed successfully, got ${scores.length} scores`);
        
        tbody.innerHTML = "";
        
        if (!scores || scores.length === 0) {
          updateDebugInfo('No scores found, showing empty state');
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="text-align: center; padding: 40px; color: var(--muted);">
                No live scores found. Add your first one above.
              </td>
            </tr>
          `;
          return;
        }

        updateDebugInfo(`Displaying ${scores.length} scores`);
        scores.forEach(s => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${escapeHtml(s.tournament)}</td>
            <td>
              <a class="view-link" href="${s.link}" target="_blank" rel="noopener noreferrer">
                Open live
              </a>
            </td>
            <td>
              <button class="delete-btn" onclick="deleteScore('${s._id}')">
                Delete
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });

        updateDebugInfo('✅ Page loaded successfully!');

      } catch (err) {
        updateDebugInfo(`❌ CATCH BLOCK: ${err.message}`);
        tbody.innerHTML = `
          <tr>
            <td colspan="3" style="text-align: center; padding: 40px; color: #ef4444;">
              Error loading scores: ${err.message}
              <br><br>
              <button class="delete-btn" onclick="loadScores()" style="background: #3b82f6;">
                🔄 Retry
              </button>
            </td>
          </tr>
        `;
      }
    }

    document.getElementById("liveForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const tournament = document.getElementById("tournament").value.trim();
      const link = document.getElementById("link").value.trim();
      
      updateDebugInfo('📤 Form submitted:');
      updateDebugInfo('Tournament: ' + tournament);
      updateDebugInfo('Link: ' + link);
      
      if (!tournament || !link) {
        updateDebugInfo('❌ Validation failed: Both fields required');
        showMessage('Both tournament name and link are required', 'error');
        return;
      }

      // Basic URL validation
      try {
        new URL(link);
        updateDebugInfo('✅ URL validation passed');
      } catch (urlError) {
        updateDebugInfo('❌ URL validation failed: ' + urlError.message);
        showMessage('Please enter a valid URL (e.g., https://example.com)', 'error');
        return;
      }

      setLoading(true);
      updateDebugInfo('🔄 Starting upload process...');

      try {
        updateDebugInfo('📤 Making POST request to: ' + API_BASE + '/livescore');
        updateDebugInfo('Request body: ' + JSON.stringify({ tournament, link }));
        
        const res = await fetch(`${API_BASE}/livescore`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ tournament, link })
        });

        updateDebugInfo('✅ POST request completed');
        updateDebugInfo('Response status: ' + res.status);
        updateDebugInfo('Response OK: ' + res.ok);

        let result;
        try {
          result = await res.json();
          updateDebugInfo('Response JSON: ' + JSON.stringify(result));
        } catch (jsonError) {
          updateDebugInfo('❌ Failed to parse JSON response: ' + jsonError.message);
          const textResponse = await res.text();
          updateDebugInfo('Raw response: ' + textResponse);
          throw new Error('Invalid server response format');
        }

        if (!res.ok) {
          updateDebugInfo('❌ Server returned error: ' + (result.error || 'Unknown error'));
          throw new Error(result.error || `Server error: ${res.status}`);
        }

        updateDebugInfo('✅ Upload successful!');
        showMessage('✅ Live score added successfully!');
        loadScores();
        e.target.reset();
        
      } catch (err) {
        updateDebugInfo('❌ Upload failed: ' + err.message);
        console.error('❌ Admin upload error:', err);
        showMessage(`Upload failed: ${err.message}`, 'error');
      } finally {
        setLoading(false);
        updateDebugInfo('🔄 Upload process completed');
      }
    });

    async function deleteScore(id) {
      if (!confirm("Are you sure you want to delete this live score?")) return;

      updateDebugInfo('🗑️ Attempting to delete score: ' + id);

      try {
        const res = await fetch(`${API_BASE}/livescore/${id}`, { 
          method: "DELETE" 
        });

        updateDebugInfo('Delete response status: ' + res.status);

        let result;
        try {
          result = await res.json();
          updateDebugInfo('Delete response: ' + JSON.stringify(result));
        } catch (jsonError) {
          updateDebugInfo('❌ Failed to parse delete response JSON');
          const textResponse = await res.text();
          updateDebugInfo('Raw delete response: ' + textResponse);
        }

        if (!res.ok) {
          throw new Error(result?.error || `Delete failed: ${res.status}`);
        }

        updateDebugInfo('✅ Delete successful!');
        showMessage('✅ Live score deleted successfully!');
        loadScores();
        
      } catch (err) {
        updateDebugInfo('❌ Delete failed: ' + err.message);
        console.error('❌ Admin delete error:', err);
        showMessage(`Delete failed: ${err.message}`, 'error');
      }
    }

    // Helper function to escape HTML
    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Add CSS for loading spinner
    const style = document.createElement('style');
    style.textContent = `
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    `;
    document.head.appendChild(style);

    // Initialize when page loads
    document.addEventListener("DOMContentLoaded", function() {
      updateDebugInfo('🚀 Admin Live Scores page loaded');
      updateDebugInfo('🌐 API Base: ' + API_BASE);
      updateDebugInfo('📝 Ready for testing');
      loadScores();
    });
  </script>
</body>
</html>

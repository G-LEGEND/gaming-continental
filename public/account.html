<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Account - Gaming Continental</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 16px;
      padding-bottom: 90px;
      color: #222;
      -webkit-tap-highlight-color: transparent;
    }
    .account-container {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: #111;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      background: #fafafa;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #1766d1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }
    button:active { background: #0f4da5; transform: scale(0.98); }
    .success { color: #0b6138; text-align: center; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
    .error { color: #b91c1c; text-align: center; font-weight: 600; margin-bottom: 10px; font-size: 14px; }
    
    #accountDetails {
      display: none;
      background: #f8fafc;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      font-size: 15px;
    }
    #accountDetails h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #1766d1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #accountDetails p { margin: 6px 0; line-height: 1.4; }
    .edit-btn { background: #f59e0b; margin-top: 10px; }
    @media (min-width: 600px) { body { max-width: 450px; margin: 0 auto; } }
  </style>
</head>

<body>
  <div class="account-container">
    <h1>My Account</h1>
    <div id="accountMessage"></div>

    <form id="accountForm">
      <input type="text" id="firstName" placeholder="First Name" required />
      <input type="text" id="lastName" placeholder="Last Name" required />
      <input type="text" id="accountNumber" placeholder="Account Number" required />
      
      <!-- ✅ Changed to Select Dropdown for Paystack Bank List -->
      <select id="bankName" required>
        <option value="">Loading banks...</option>
      </select>
      
      <input type="tel" id="phoneNumber" placeholder="Phone Number" />
      <button type="submit" id="submitBtn">Save Bank Details</button>
    </form>

    <div id="accountDetails">
      <h3>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1766d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Your Bank Details
      </h3>
      <p><strong>Account Name:</strong> <span id="savedAccountName"></span></p>
      <p><strong>Account Number:</strong> <span id="savedAccountNumber"></span></p>
      <p><strong>Bank Name:</strong> <span id="savedBankName"></span></p>
      <p><strong>Phone Number:</strong> <span id="savedPhoneNumber"></span></p>
      <button type="button" class="edit-btn" onclick="showEditForm()">Edit Details</button>
    </div>
  </div>

  <div id="footerContainer"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const API_BASE = window.location.origin;
      const userId = localStorage.getItem("userId");

      if (!userId) {
        alert("Please login first!");
        window.location.href = "index.html";
        return;
      }

      const messageEl = document.getElementById("accountMessage");
      const form = document.getElementById("accountForm");
      const details = document.getElementById("accountDetails");
      const submitBtn = document.getElementById("submitBtn");
      const bankSelect = document.getElementById("bankName");

      if (form) form.style.display = "block";
      if (details) details.style.display = "none";

      // ✅ Fetch official Paystack Bank List
      async function loadBanks() {
        try {
          const res = await fetch(`${API_BASE}/paystack/banks`);
          const data = await res.json();
          
          if (Array.isArray(data)) {
            bankSelect.innerHTML = '<option value="">Select your bank</option>';
            data.forEach(bank => {
              const opt = document.createElement("option");
              opt.value = bank.name;
              opt.textContent = bank.name;
              bankSelect.appendChild(opt);
            });
          } else {
            bankSelect.innerHTML = '<option value="">Failed to load banks</option>';
          }
        } catch (err) {
          bankSelect.innerHTML = '<option value="">Error loading banks</option>';
        }
      }

      loadBanks();

      function showMessage(message, isError = false) {
        if (messageEl) {
          messageEl.textContent = message;
          messageEl.className = isError ? 'error' : 'success';
          messageEl.style.display = 'block';
          setTimeout(() => { messageEl.style.display = 'none'; }, 5000);
        }
      }

      window.showEditForm = function() {
        if (details) details.style.display = "none";
        if (form) form.style.display = "block";
      }

      async function loadUser() {
        try {
          let userData = null;
          const localUser = localStorage.getItem("user");
          if (localUser) {
            try { userData = JSON.parse(localUser); } catch (e) {}
          }

          if (!userData || !userData.bankDetails) {
            const res = await fetch(`${API_BASE}/auth/me?userId=${userId}`);
            if (res.ok) {
              userData = await res.json();
              localStorage.setItem("user", JSON.stringify(userData));
            }
          }

          if (!userData) {
            showMessage("Could not load account data", true);
            return;
          }

          if (form) {
            if (userData.firstName) form.firstName.value = userData.firstName || "";
            if (userData.lastName) form.lastName.value = userData.lastName || "";
            if (userData.phoneNumber) form.phoneNumber.value = userData.phoneNumber || "";

            if (userData.bankDetails) {
              if (userData.bankDetails.accountNumber) form.accountNumber.value = userData.bankDetails.accountNumber || "";
              if (userData.bankDetails.bankName) form.bankName.value = userData.bankDetails.bankName || "";
            }
          }

          if (userData.bankDetails && userData.bankDetails.accountNumber && details) {
            details.style.display = "block";
            if (form) form.style.display = "none";
            
            document.getElementById("savedAccountName").textContent = `${userData.firstName || ''} ${userData.lastName || ''}`.trim() || "Not provided";
            document.getElementById("savedAccountNumber").textContent = userData.bankDetails.accountNumber;
            document.getElementById("savedBankName").textContent = userData.bankDetails.bankName;
            document.getElementById("savedPhoneNumber").textContent = userData.phoneNumber || "Not provided";
          } else {
            if (details) details.style.display = "none";
            if (form) form.style.display = "block";
          }

        } catch (err) {
          showMessage("Error loading account details", true);
        }
      }

      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          
          const firstName = form.firstName.value.trim();
          const lastName = form.lastName.value.trim();
          const accountNumber = form.accountNumber.value.trim();
          const bankName = form.bankName.value;
          const phoneNumber = form.phoneNumber.value.trim();

          if (!firstName || !lastName || !accountNumber || !bankName) {
            return showMessage("Please fill in all required fields", true);
          }

          if (accountNumber.length < 10 || !/^\d+$/.test(accountNumber)) {
            return showMessage("Please enter a valid account number (at least 10 digits)", true);
          }

          const body = { firstName, lastName, accountNumber, bankName, phoneNumber };

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";
          }

          try {
            const res = await fetch(`${API_BASE}/user/update-account/${userId}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });

            if (!res.ok) throw new Error("Failed to update account");

            const data = await res.json();
            showMessage("Bank details saved successfully!");

            if (data.user) {
              localStorage.setItem("user", JSON.stringify(data.user));
            }

            setTimeout(() => { loadUser(); }, 1000);

          } catch (err) {
            showMessage("Error: " + err.message, true);
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = "Save Bank Details";
            }
          }
        });
      }

      loadUser();
      
      fetch('footer.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('footerContainer').innerHTML = html;
          if (typeof setupFooter === 'function') setupFooter();
        });
    });
  </script>

  <script src="footer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gaming Continental - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding-bottom: 80px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .welcome-text {
      color: #718096;
      font-size: 0.9rem;
    }

    .dashboard {
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .balance-card {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      position: relative;
      overflow: hidden;
    }

    .balance-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
      transform: rotate(45deg);
    }

    .rank-card {
      background: linear-gradient(135deg, #059669, #10b981);
      color: white;
    }

    .card-title {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .card-value {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .nav-grid {
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .nav-item {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .nav-item:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .nav-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .nav-icon svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #2d3748;
      line-height: 1.2;
    }

    .nav-item[data-page="deposit.html"] .nav-icon { background: linear-gradient(135deg, #059669, #10b981); }
    .nav-item[data-page="tournament.html"] .nav-icon { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .nav-item[data-page="withdraw.html"] .nav-icon { background: linear-gradient(135deg, #d97706, #f59e0b); }
    .nav-item[data-page="rank.html"] .nav-icon { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
    .nav-item[data-page="livescores.html"] .nav-icon { background: linear-gradient(135deg, #0369a1, #0ea5e9); }
    .nav-item[data-page="bet.html"] .nav-icon { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .nav-item[data-page="history.html"] .nav-icon { background: linear-gradient(135deg, #6b7280, #9ca3af); }
    .nav-item[data-page="live.html"] .nav-icon { background: linear-gradient(135deg, #dc2626, #ef4444); }
    .nav-item[data-page="account.html"] .nav-icon { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .nav-item[data-page="casino.html"] .nav-icon { background: linear-gradient(135deg, #f59e0b, #ef4444); }
    
    /* Games Button Icon Color */
    .nav-item[data-page="game-lobby.html"] .nav-icon { background: linear-gradient(135deg, #8b5cf6, #3b82f6); }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: space-around;
      padding: 12px 16px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      border-radius: 12px;
      transition: all 0.3s ease;
      cursor: pointer;
      min-width: 60px;
    }

    .nav-tab:active {
      background: rgba(79, 70, 229, 0.1);
      transform: scale(0.95);
    }

    .nav-tab.active {
      background: rgba(79, 70, 229, 0.1);
    }

    .tab-icon {
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tab-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #4a5568;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: all 0.3s ease;
    }

    .nav-tab.active .tab-icon svg {
      stroke: #4f46e5;
    }

    .tab-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: #4a5568;
    }

    .nav-tab.active .tab-label {
      color: #4f46e5;
    }

    .loading {
      opacity: 0.7;
      pointer-events: none;
      position: relative;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      margin: -10px 0 0 -10px;
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .pulse {
      animation: pulse 0.6s ease-in-out;
    }

    @media (min-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr 1fr;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .nav-grid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 500px;
        margin-left: auto;
        margin-right: auto;
      }
      
      .bottom-nav {
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 20px 20px 0 0;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 320px) {
      .nav-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .nav-icon {
        width: 45px;
        height: 45px;
      }
      
      .card-value {
        font-size: 1.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Welcome, <span id="nickname">Player</span></h1>
    <div class="welcome-text">Ready to play and win?</div>
  </div>

  <div class="dashboard">
    <div class="card balance-card">
      <div class="card-title">Available Balance</div>
      <div class="card-value">₦<span id="balance">0.00</span></div>
    </div>
    <div class="card rank-card">
      <div class="card-title">Your Rank</div>
      <div class="card-value" id="rank">Unranked</div>
    </div>
  </div>

  <div class="nav-grid">
    <div class="nav-item" data-page="deposit.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
      </div>
      <div class="nav-label">Deposit</div>
    </div>

    <div class="nav-item" data-page="tournament.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
      </div>
      <div class="nav-label">Tournament</div>
    </div>

    <div class="nav-item" data-page="withdraw.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      </div>
      <div class="nav-label">Withdraw</div>
    </div>

    <div class="nav-item" data-page="rank.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"></path></svg>
      </div>
      <div class="nav-label">Rankings</div>
    </div>

    <div class="nav-item" data-page="livescores.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
      </div>
      <div class="nav-label">Livescores</div>
    </div>

    <div class="nav-item" data-page="bet.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><path d="M3 9h18"></path><path d="M9 21V9"></path></svg>
      </div>
      <div class="nav-label">Bet</div>
    </div>

    <div class="nav-item" data-page="casino.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><circle cx="15.5" cy="15.5" r="1.5"></circle><circle cx="15.5" cy="8.5" r="1.5"></circle><circle cx="8.5" cy="15.5" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle></svg>
      </div>
      <div class="nav-label">Casino</div>
    </div>

    <!-- ✅ FIXED: Games Button -->
    <div class="nav-item" data-page="game-lobby.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 10c-.83 0-1.5-.67-1.5-1.5v-5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5z"></path>
          <path d="M20.5 10H19V8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"></path>
          <path d="M9.5 14c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S8 21.33 8 20.5v-5c0-.83.67-1.5 1.5-1.5z"></path>
          <path d="M3.5 14H5v1.5c0 .83-.67 1.5-1.5 1.5S2 16.33 2 15.5 2.67 14 3.5 14z"></path>
          <path d="M14 14.5c0-.83.67-1.5 1.5-1.5h5c.83 0 1.5.67 1.5 1.5s-.67 1.5-1.5 1.5h-5c-.83 0-1.5-.67-1.5-1.5z"></path>
          <path d="M15.5 2c.83 0 1.5.67 1.5 1.5v5c0 .83-.67 1.5-1.5 1.5S14 9.33 14 8.5v-5c0-.83.67-1.5 1.5-1.5z"></path>
          <path d="M10 9.5C10 8.67 9.33 8 8.5 8h-5C2.67 8 2 8.67 2 9.5S2.67 11 3.5 11h5c.83 0 1.5-.67 1.5-1.5z"></path>
        </svg>
      </div>
      <div class="nav-label">Games</div>
    </div>

    <div class="nav-item" data-page="history.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M12 8v4l3 3"></path><circle cx="12" cy="12" r="10"></circle></svg>
      </div>
      <div class="nav-label">History</div>
    </div>

    <div class="nav-item" data-page="live.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      </div>
      <div class="nav-label">Live</div>
    </div>

    <div class="nav-item" data-page="account.html">
      <div class="nav-icon">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="nav-label">Account</div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-tab active" data-page="dashboard.html">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      </div>
      <div class="tab-label">Home</div>
    </div>
    <div class="nav-tab" data-page="deposit.html">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2"></circle></svg>
      </div>
      <div class="tab-label">Deposit</div>
    </div>
    <div class="nav-tab" data-page="withdraw.html">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      </div>
      <div class="tab-label">Withdraw</div>
    </div>
    <div class="nav-tab" data-page="account.html">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="tab-label">Account</div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function loadUser() {
      try {
        const token = localStorage.getItem("token");
        const userId = localStorage.getItem("userId");
        
        if (!token || !userId) {
          window.location.href = "index.html";
          return;
        }

        const res = await fetch(`${API_BASE}/auth/me?userId=${userId}`, {
          headers: { 
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
        });

        if (!res.ok) {
          if (res.status === 401 || res.status === 404) {
            localStorage.clear();
            window.location.href = "index.html";
            return;
          }
          throw new Error(`HTTP error! status: ${res.status}`);
        }

        const user = await res.json();

        document.getElementById("nickname").textContent = user.nickname || "Player";
        
        const balanceElement = document.getElementById("balance");
        balanceElement.textContent = (user.balance || 0).toFixed(2);
        balanceElement.parentElement.classList.add('pulse');
        setTimeout(() => balanceElement.parentElement.classList.remove('pulse'), 600);

        const totalPoints = (user.fifaPoints || 0) + (user.snookerPoints || 0);
        let rankText = "Unranked";

        if (totalPoints > 0) {
          if (user.rank === 1) rankText = "1st Place";
          else if (user.rank === 2) rankText = "2nd Place";
          else if (user.rank === 3) rankText = "3rd Place";
          else rankText = `#${user.rank || '?'} (${totalPoints} pts)`;
        }

        document.getElementById("rank").textContent = rankText;

        localStorage.setItem(
          "user",
          JSON.stringify({
            id: user._id,
            nickname: user.nickname,
            balance: user.balance,
            fifaPoints: user.fifaPoints || 0,
            snookerPoints: user.snookerPoints || 0,
            rank: user.rank || 0,
          })
        );
        
      } catch (err) {
        console.error("❌ User load failed:", err);
        localStorage.clear();
        window.location.href = "index.html";
      }
    }

    function goPage(page) {
      window.location.href = page;
    }

    function setupNavigation() {
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => {
        item.addEventListener('click', function() {
          goPage(this.getAttribute('data-page'));
        });
      });

      const navTabs = document.querySelectorAll('.nav-tab');
      navTabs.forEach(tab => {
        tab.addEventListener('click', function() {
          goPage(this.getAttribute('data-page'));
        });
      });
    }

    document.addEventListener("DOMContentLoaded", function() {
      loadUser();
      setupNavigation();
    });
  </script>
</body>
</html>

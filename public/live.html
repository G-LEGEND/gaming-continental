<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Streams - Gaming Continental</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
      padding-bottom: 90px;
    }

    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 16px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .header h1 svg {
      width: 24px;
      height: 24px;
      stroke: #dc2626;
    }

    .welcome-text {
      color: #718096;
      font-size: 0.9rem;
    }

    .center { 
      padding: 0 16px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .video-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      position: relative;
    }

    .video-player {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      background: #000;
    }

    .now-playing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .now-playing-badge {
      background: #dc2626;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .live-dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.4; } }

    .video-title {
      font-weight: 600;
      color: #2d3748;
      font-size: 1rem;
      margin-top: 12px;
      line-height: 1.3;
    }

    .video-controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .control-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .control-btn:active {
      transform: translateY(2px);
    }

    .next-btn {
      background: #4f46e5;
      color: white;
    }

    .fullscreen-btn {
      background: #6b7280;
      color: white;
    }

    .streams-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 32px;
    }

    .stream-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .stream-card:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .stream-title {
      font-weight: 600;
      color: #2d3748;
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .stream-description {
      color: #718096;
      font-size: 0.9rem;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .watch-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      border: none;
      cursor: pointer;
    }

    .watch-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }

    .live-badge {
      background: #dc2626;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .no-streams {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .no-streams svg {
      width: 48px;
      height: 48px;
      stroke: #cbd5e1;
      margin-bottom: 16px;
    }

    .no-streams h3 {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #2d3748;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .loading-spinner {
      border: 3px solid #e2e8f0;
      border-top: 3px solid #4f46e5;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fullscreen-mode {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1000;
      display: none;
    }

    .fullscreen-video {
      width: 100%;
      height: 100%;
    }

    .exit-fullscreen {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .exit-fullscreen svg {
      width: 24px;
      height: 24px;
      stroke: white;
    }

    @media (max-width: 480px) {
      .stream-card { padding: 16px; }
      .header h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
      Live Streams
    </h1>
    <div class="welcome-text">Watch live gaming tournaments in real-time</div>
  </div>

  <div class="center">
    <div class="video-container" id="videoContainer" style="display: none;">
      <div class="now-playing">
        <div class="now-playing-badge"><span class="live-dot"></span> NOW PLAYING</div>
      </div>
      <div id="videoPlayer" class="video-player"></div>
      <div class="video-title" id="currentVideoTitle"></div>
      <div class="video-controls">
        <button class="control-btn next-btn" onclick="playNextStream()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          Next Stream
        </button>
        <button class="control-btn fullscreen-btn" onclick="enterFullscreen()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          Fullscreen
        </button>
      </div>
    </div>

    <div class="streams-container" id="streamsList"></div>
  </div>

  <div class="fullscreen-mode" id="fullscreenMode">
    <button class="exit-fullscreen" onclick="exitFullscreen()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div id="fullscreenVideo" class="fullscreen-video"></div>
  </div>

  <!-- Footer Container -->
  <div id="footerContainer"></div>

  <script>
    const API_BASE = window.location.origin;
    let currentStreamIndex = 0;
    let player;
    let fullscreenPlayer;
    let streams = [];

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      loadStreams();
    }

    async function loadStreams() {
      const list = document.getElementById("streamsList");
      
      list.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <div>Loading live streams...</div>
        </div>
      `;

      try {
        const response = await fetch(`${API_BASE}/livestream`);
        
        if (!response.ok) throw new Error('Failed to fetch streams');
        
        streams = await response.json();
        
        if (streams.length === 0) {
          document.getElementById('videoContainer').style.display = 'none';
          if (player) player.stopVideo();
        }
        
        displayStreams(streams);
        
        if (streams.length > 0 && (!player || player.getPlayerState() === -1 || player.getPlayerState() === 0 || player.getPlayerState() === 5)) {
          setTimeout(() => { playStream(0); }, 1000);
        }
        
      } catch (err) {
        console.error("Error loading streams:", err);
        showNoStreams();
      }
    }

    function displayStreams(streams) {
      const list = document.getElementById("streamsList");
      
      if (!streams || streams.length === 0) {
        showNoStreams();
        return;
      }

      list.innerHTML = '<h3 style="margin-bottom: 16px; color: #2d3748;">Available Streams</h3>';
      
      streams.forEach((stream, index) => {
        const streamCard = document.createElement("div");
        streamCard.className = "stream-card";
        streamCard.innerHTML = `
          <div class="live-badge"><span class="live-dot"></span> LIVE NOW</div>
          <div class="stream-title">${stream.tournament}</div>
          <div class="stream-description">${stream.description}</div>
          <button class="watch-btn" onclick="playStream(${index})">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Play This Stream
          </button>
        `;
        list.appendChild(streamCard);
      });
    }

    function showNoStreams() {
      const list = document.getElementById("streamsList");
      list.innerHTML = `
        <div class="no-streams">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          <h3>No Live Streams</h3>
          <p>There are no active streams right now</p>
          <p style="margin-top: 16px; font-size: 0.9rem;">
            Check back later
          </p>
        </div>
      `;
    }

    function playStream(index) {
      if (!streams[index]) return;
      
      currentStreamIndex = index;
      const stream = streams[index];
      
      document.getElementById('videoContainer').style.display = 'block';
      document.getElementById('currentVideoTitle').textContent = stream.tournament;
      
      document.getElementById('videoContainer').scrollIntoView({ behavior: 'smooth' });
      
      const videoId = extractYouTubeId(stream.link);
      
      if (videoId) {
        if (player) {
          player.loadVideoById(videoId);
        } else {
          player = new YT.Player('videoPlayer', {
            height: '220',
            width: '100%',
            videoId: videoId,
            playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 },
            events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
          });
        }
      }
    }

    function playNextStream() {
      if (streams.length === 0) return;
      const nextIndex = (currentStreamIndex + 1) % streams.length;
      playStream(nextIndex);
    }

    function onPlayerReady(event) { event.target.playVideo(); }
    function onPlayerStateChange(event) {}

    function extractYouTubeId(url) {
      if (!url) return null;
      const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(live\/))([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[7].length === 11) ? match[7] : null;
    }

    function enterFullscreen() {
      const fullscreenMode = document.getElementById('fullscreenMode');
      const stream = streams[currentStreamIndex];
      const videoId = extractYouTubeId(stream.link);
      
      if (videoId) {
        fullscreenMode.style.display = 'block';
        
        if (fullscreenPlayer) {
          fullscreenPlayer.loadVideoById(videoId);
        } else {
          fullscreenPlayer = new YT.Player('fullscreenVideo', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: { 'autoplay': 1, 'controls': 1, 'rel': 0, 'modestbranding': 1 }
          });
        }
      }
    }

    function exitFullscreen() {
      document.getElementById('fullscreenMode').style.display = 'none';
      if (fullscreenPlayer) fullscreenPlayer.stopVideo();
    }

    function startAutoRefresh() {
      setInterval(() => { loadStreams(); }, 30000);
    }

    document.addEventListener("DOMContentLoaded", function() {
      startAutoRefresh();

      // ✅ Load Footer
      fetch('footer.html')
        .then(res => res.text())
        .then(html => {
          document.getElementById('footerContainer').innerHTML = html;
          if (typeof setupFooter === 'function') setupFooter();
        });
    });
  </script>

  <!-- ✅ Load footer script -->
  <script src="footer.js"></script>
</body>
</html>
